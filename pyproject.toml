[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["octacrypt*"]
exclude = ["native*", "tests*"]

[project]
name = "octacrypt"
version = "0.4.0"
description = "Maximum-grade cryptographic CLI toolkit by Octagram"
authors = [{ name = "Octagram" }]
requires-python = ">=3.10"

dependencies = [
    "cryptography>=47",
    "click",
    "bcrypt",
    "rich",
    "questionary",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
octacrypt     = "octacrypt.cli.cli:cli"
octacrypt-tui = "octacrypt.tui.tui:main"
